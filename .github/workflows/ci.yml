name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and API tests
        run: pytest --cov=app --cov-report=term --cov-fail-under=85
      - name: Retrieval quality gate (Hit@3 >= 0.8)
        run: python -m eval.run_eval --k 3 --min-hit-rate 0.8 --out eval/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval/results.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Smoke test the running stack
        run: |
          docker compose up -d qdrant backend
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -F "file=@backend/eval/corpus/containers_ci.md" localhost:8000/documents
          curl -sf -H "Content-Type: application/json" \
            -d '{"question":"Why use a multi-stage Dockerfile?"}' localhost:8000/ask | tee answer.json
          grep -q containers_ci.md answer.json
      - if: always()
        run: docker compose down -v
